name: Mendeley Google Drive Sync

on:
  schedule:
    # Run once a day at 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      queue_folder:
        description: 'Comma-separated Google Drive folder paths to watch recursively (excludes Processed/ and Quarantined/)'
        required: false
        default: 'Mendeley_Queue,books1/chapters'
        type: string
      max_files:
        description: 'Maximum PDFs to process in this run'
        required: false
        default: '500'
        type: string
      upload_workers:
        description: 'Concurrent Mendeley upload workers'
        required: false
        default: '4'
        type: string
      auto_continue:
        description: 'Automatically trigger follow-up run if more files remain'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  sync:
    runs-on: [self-hosted, oci]
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies & rclone
        run: |
          if ! command -v rclone &>/dev/null; then
            apt-get update && apt-get install -y rclone
          fi
          pip install --upgrade pip
          pip install requests

      - name: Configure rclone
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONFIG }}
        run: |
          if [ -z "$RCLONE_CONF" ]; then
            echo "::error::RCLONE_CONFIG secret is not configured in this repository."
            exit 1
          fi
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          rclone listremotes

      - name: Run Mendeley Cloud Sync
        id: sync
        env:
          MENDELEY_CLIENT_ID: ${{ secrets.MENDELEY_CLIENT_ID }}
          MENDELEY_CLIENT_SECRET: ${{ secrets.MENDELEY_CLIENT_SECRET }}
          MENDELEY_REFRESH_TOKEN: ${{ secrets.MENDELEY_REFRESH_TOKEN }}
          GDRIVE_QUEUE_FOLDER: ${{ inputs.queue_folder || 'Mendeley_Queue,books1/chapters' }}
          MAX_FILES_PER_RUN: ${{ inputs.max_files || '500' }}
          UPLOAD_WORKERS: ${{ inputs.upload_workers || '4' }}
        run: |
          python sync_drive_to_mendeley.py

      - name: Archive Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mendeley-sync-logs
          path: mendeley_sync.log
          retention-days: 90

      - name: Commit Updated Manifest Ledger to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(manifest): update mendeley upload ledger [skip ci]"
            git pull --rebase origin main
            git push origin main
            echo "Manifest ledger committed and pushed to main."
          else
            echo "No changes to manifest.json."
          fi

      - name: Send Email Notification (Only When PDFs Uploaded)
        if: success() && steps.sync.outputs.uploaded_count != '0' && steps.sync.outputs.uploaded_count != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          run_url = os.environ["RUN_URL"]
          title = "📚 Mendeley Upload Digest"

          summary = "New PDFs were uploaded from Google Drive to Mendeley."
          if os.path.exists("run_summary.md"):
              with open("run_summary.md", "r", encoding="utf-8") as f:
                  summary = f.read().strip()

          body = f"cc @georgetalamantez\n\n{summary}\n\n🔗 **Workflow Run:** [{run_url}]({run_url})"

          def gh_api(path, method="GET", payload=None):
              url = f"https://api.github.com/repos/{repo}/{path.lstrip('/')}"
              headers = {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "Mendeley-Upload-Digest",
              }
              data = json.dumps(payload).encode("utf-8") if payload is not None else None
              if data:
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req) as resp:
                  return json.loads(resp.read().decode("utf-8"))

          issues = gh_api("issues?state=open&per_page=50")
          digest_issue = next((i for i in issues if i.get("title") == title and "pull_request" not in i), None)

          if not digest_issue:
              digest_issue = gh_api("issues", method="POST", payload={
                  "title": title,
                  "body": "Automated email notification thread for the Mendeley Google Drive Sync workflow.\n\nComments are only posted below (`@georgetalamantez`) on runs where 1 or more new PDFs were uploaded to Mendeley."
              })
              print(f"Created tracking issue #{digest_issue['number']}")

          comment = gh_api(f"issues/{digest_issue['number']}/comments", method="POST", payload={"body": body})
          print(f"Posted Mendeley upload digest comment to issue #{digest_issue['number']}: {comment.get('html_url')}")
          PY

      - name: Trigger Follow-Up Run (If Queue Has Remaining Files)
        if: steps.sync.outputs.has_more_files == 'true' && (github.event_name != 'workflow_dispatch' || inputs.auto_continue != false)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Queue has remaining files. Triggering subsequent workflow run..."
          sleep 15
          gh workflow run mendeley-sync.yml
